 where you live, that you study Finnish.",words:[{fi:"minä",en:"I",exampleFi:"Minä olen opiskelija.",source:"book",phonetic:"mi-nae"},{fi:"sinä",en:"you",exampleFi:"Sinä olet suomen kurssilla.",source:"book",phonetic:"si-nae"},{fi:"hän",en:"he/she",exampleFi:"Hän on opettaja.",source:"book",phonetic:"haen"},{fi:"me",en:"we",exampleFi:"Me olemme ystäviä.",source:"book"},{fi:"te",en:"you all/you plural",exampleFi:"Te olette kotona.",source:"book"},{fi:"he",en:"they",exampleFi:"He ovat Helsingissä.",source:"book"},{fi:"tervetuloa",en:"welcome",exampleFi:"Tervetuloa Suomeen!",source:"book"},{fi:"hauska tutustua",en:"nice to meet you",exampleFi:"Hei! Hauska tutustua.",source:"book"},{fi:"nimi",en:"name",exampleFi:"Minun nimeni on Pedro.",source:"book"},{fi:"opiskelija",en:"student",exampleFi:"Olen opiskelija.",source:"book"},{fi:"opettaja",en:"teacher",exampleFi:"Opettaja on mukava.",source:"book"},{fi:"kurssi",en:"course",exampleFi:"Suomen kurssi alkaa tänään.",source:"book"},{fi:"nähdään",en:"see you",exampleFi:"Nähdään huomenna!",source:"book"},{fi:"huomenta",en:"good morning",exampleFi:"Huomenta! Mitä kuuluu?",source:"book",phonetic:"huo-men-ta"},{fi:"iltaa",en:"good evening",exampleFi:"Hyvää iltaa!",source:"book"},{fi:"Hei",en:"Hello / Hi",exampleFi:"Hei! Mitä kuuluu?",exampleEn:"Hi! How are you?",phonetic:"hey",source:"yours"},{fi:"Terve",en:"Hello / Greetings",exampleFi:"Terve Anna!",exampleEn:"Hello Anna!",phonetic:"ter-veh",source:"yours"},{fi:"Mitä kuuluu?",en:"How are you?",exampleFi:"Mitä kuuluu sinulle?",exampleEn:"How are you doing?",phonetic:"mi-tae kuu-luu",source:"yours"},{fi:"Kiitos, hyvää",en:"Thanks, good",exampleFi:"Kiitos, minulle kuuluu hyvää.",exampleEn:"Thanks, I am doing fine.",phonetic:"kee-tos hy-vae-ae",source:"yours"},{fi:"Olen",en:"I am",exampleFi:"Minä olen iloinen.",exampleEn:"I am happy.",phonetic:"o-len",source:"yours"},{fi:"On",en:"Is / S/he is",exampleFi:"Suomi on kaunis.",exampleEn:"Finland is beautiful.",phonetic:"on",source:"yours"}],lessons:[{fromDay:1,title:"Tervehdykset & Tutustuminen",subtitle:"Greetings & Basic Introductions",html:`<h3>Greetings & Polite Expressions</h3>
<p>In Finnish, formal and informal greetings are widely used depending on the situation:</p>
<ul>
<li><strong>Hei / Moi</strong> = Informal "Hi"</li>
<li><strong>Päivää / Hyvää päivää</strong> = Formal "Good day"</li>
<li><strong>Näkemiin</strong> = Goodbye (Formal)</li>
<li><strong>Moi moi / Hei hei</strong> = Bye bye (Informal)</li>
</ul>`},{fromDay:3,title:"Persoonapronominit & 'Olla'-verbi",subtitle:"Personal Pronouns & Verb 'To Be'",html:`<h3>Conjugating 'Olla' (To Be)</h3>
<div>
<div>minä olen (I am)</div><div>me olemme (we are)</div>
<div>sinä olet (you are)</div><div>te olette (you all are)</div>
<div>hän on (he/she is)</div><div>he ovat (they are)</div>
</div>`}],quiz:[{type:"mc",question:"How do you say 'Good morning' in Finnish?",options:["Hyvää iltaa","Huomenta","Kiitos","Näkemiin"],correct:1,explanation:"'Huomenta' or 'Hyvää huomenta' translates to Good Morning.",fromDay:1},{type:"fitb",question:"Complete the sentence: 'Mitä ______?' (How are you?)",correctAnswer:"kuuluu",explanation:"'Mitä kuuluu?' literally means 'What is heard?' and translates to 'How are you?'",fromDay:1},{type:"mc",question:"Fill in the blank: 'Minä ___ opiskelija.'",options:["on","olet","olen","ovat"],correct:2,explanation:"'Minä' takes the verb form 'olen'.",fromDay:3}]},{day:2,chapter:1,title:"Hei ja tervetuloa!",theme:"Days of the week, alphabet, numbers 0–100",category:"Numbers",pages:"14–15, 17–27",grammar:"Vowel harmony (a o u vs ä ö y) and long vs short vowels",grammarFile:"grammar/vowel-harmony.md",sentences:["Tänään on maanantai.","Huomenna on tiistai.","Puhelinnumeroni on 040 123 4567.","Minä olen kolmekymmentä vuotta.","Kurssi on keskiviikkona."],task:"Write today's and tomorrow's day, your age, and spell your name in Finnish letters.",words:[{fi:"maanantai",en:"Monday",exampleFi:"Tänään on maanantai.",source:"book",phonetic:"maa-nan-tai"},{fi:"tiistai",en:"Tuesday",exampleFi:"Huomenna on tiistai.",source:"book"},{fi:"keskiviikko",en:"Wednesday",exampleFi:"Kurssi on keskiviikkona.",source:"book"},{fi:"torstai",en:"Thursday",exampleFi:"Torstaina menen kauppaan.",source:"book"},{fi:"perjantai",en:"Friday",exampleFi:"Perjantaina syön kalaa.",source:"book",phonetic:"per-jan-tai"},{fi:"lauantai",en:"Saturday",exampleFi:"Lauantaina nukun pitkään.",source:"book"},{fi:"sunnuntai",en:"Sunday",exampleFi:"Sunnuntaina olen kotona.",source:"book"},{fi:"tänään",en:"today",exampleFi:"Tänään on kylmä.",source:"book",phonetic:"tae-nae-aen"},{fi:"huomenna",en:"tomorrow",exampleFi:"Nähdään huomenna.",source:"book",phonetic:"huo-men-na"},{fi:"eilen",en:"yesterday",exampleFi:"Eilen oli sunnuntai.",source:"book",phonetic:"ei-len"},{fi:"viikonloppu",en:"weekend",exampleFi:"Hyvää viikonloppua!",source:"book"},{fi:"nolla",en:"zero",exampleFi:"Puhelinnumero alkaa nollalla.",source:"book"},{fi:"neljä",en:"four",exampleFi:"Minulla on neljä tuolia.",source:"book"},{fi:"viisi",en:"five",exampleFi:"Kello on viisi.",source:"book"},{fi:"kymmenen",en:"ten",exampleFi:"Kurssilla on kymmenen opiskelijaa.",source:"book",phonetic:"kym-me-nen"},{fi:"kaksikymmentä",en:"twenty",exampleFi:"Hän on kaksikymmentä vuotta.",source:"book"},{fi:"sata",en:"hundred",exampleFi:"Sata euroa on paljon.",source:"book"},{fi:"Yksi",en:"One (1)",exampleFi:"Yksi kahvi, kiitos.",exampleEn:"One coffee, please.",phonetic:"uek-si",source:"yours"},{fi:"Kaksi",en:"Two (2)",exampleFi:"Kaksi lippua.",exampleEn:"Two tickets.",phonetic:"kak-si",source:"yours"},{fi:"Kolme",en:"Three (3)",exampleFi:"Kolme euroa.",exampleEn:"Three euros.",phonetic:"kol-me",source:"yours"},{fi:"Kello",en:"Clock / Time",exampleFi:"Paljonko kello on?",exampleEn:"What time is it?",phonetic:"kel-lo",source:"yours"}],lessons:[{fromDay:2,title:"Numerot 1-20 & Aika",subtitle:"Numbers 1-20 & Time Basics",html:`<h3>Counting & Asking Time</h3>
<p>Numbers 11-19 are formed by adding <strong>-toista</strong> to numbers 1-9:</p>
<div>
<p>11 = yksitoista | 12 = kaksitoista | 15 = viisitoista</p>
</div>`},{fromDay:10,title:"Viikonpäivät & Ajankohdat",subtitle:"Days of the Week & Time Expressions",html:`<h3>Days of the Week (+na/nä)</h3>
<p>To say "on Monday", add <strong>-na / -nä</strong> to the day name:</p>
<p>Maanantai -> Maanantaina (On Monday)</p>`}],quiz:[{type:"mc",question:"What is the Finnish word for number 12?",options:["Kymmenen","Kaksitoista","Yksitoista","Kaksi"],correct:1,explanation:"12 is created by combining Kaksi + toista = Kaksitoista.",fromDay:2},{type:"mc",question:"How do you say 'On Friday' in Finnish?",options:["Perjantai","Perjantaina","Huomenna","Eilen"],correct:1,explanation:"Add -na ending: Perjantai -> Perjantaina.",fromDay:10}]},{day:3,chapter:2,title:"Minkämaalainen sinä olet?",theme:"Countries, nationalities, languages",category:"Countries",pages:"28–41",grammar:"Consonant gradation (k-p-t) in nouns: Helsinki → Helsingissä, Turku → Turussa (see also Minikielioppi p. 311–312)",grammarFile:"grammar/consonant-gradation.md",sentences:["Mistä sinä olet kotoisin?","Minä olen kotoisin ___.","Puhun englantia ja vähän suomea.","Asun Espoossa.","Hän on ruotsalainen."],task:"Write where you are from, what languages you speak, and where you live now.",words:[{fi:"maa",en:"country",exampleFi:"Mikä maa?",source:"book"},{fi:"Suomi",en:"Finland",exampleFi:"Asun Suomessa.",source:"book"},{fi:"Ruotsi",en:"Sweden",exampleFi:"Ruotsi on Suomen naapuri.",source:"book"},{fi:"Venäjä",en:"Russia",exampleFi:"Venäjä on iso maa.",source:"book"},{fi:"Englanti",en:"England",exampleFi:"Hän on kotoisin Englannista.",source:"book"},{fi:"suomalainen",en:"Finnish/a Finn",exampleFi:"Hanna on suomalainen.",source:"book"},{fi:"ruotsalainen",en:"Swedish/a Swede",exampleFi:"Hän on ruotsalainen.",source:"book"},{fi:"kieli",en:"language",exampleFi:"Suomi on vaikea kieli.",source:"book"},{fi:"suomi",en:"Finnish language",exampleFi:"Puhun vähän suomea.",source:"book"},{fi:"englanti",en:"English language",exampleFi:"Puhun englantia.",source:"book"},{fi:"kotoisin",en:"from (originally)",exampleFi:"Mistä olet kotoisin?",source:"book"},{fi:"asua",en:"to live",exampleFi:"Asun Espoossa.",source:"book"},{fi:"kaupunki",en:"city/town",exampleFi:"Helsinki on kaupunki.",source:"book"},{fi:"pääkaupunki",en:"capital city",exampleFi:"Suomen pääkaupunki on Helsinki.",source:"book"},{fi:"vähän",en:"a little",exampleFi:"Puhun vähän ruotsia.",source:"book"},{fi:"hyvin",en:"well",exampleFi:"Hän puhuu suomea hyvin.",source:"book"},{fi:"Kukka",en:"Flower",exampleFi:"Kukka on kaunis.",exampleEn:"Flower is beautiful.",phonetic:"kuk-ka",source:"yours"},{fi:"Kukassa",en:"In the flower",exampleFi:"Perhonen on kukassa.",exampleEn:"Butterfly is in the flower.",phonetic:"ku-kas-sa",source:"yours"},{fi:"Katu",en:"Street",exampleFi:"Asun kadulla.",exampleEn:"I live on street.",phonetic:"ka-tu",source:"yours"},{fi:"Kadulla",en:"On the street",exampleFi:"Autot ajavat kadulla.",exampleEn:"Cars drive on street.",phonetic:"ka-dul-la",source:"yours"},{fi:"Tapahtuma",en:"Event",exampleFi:"Tämä on kiva tapahtuma.",exampleEn:"This is a nice event.",phonetic:"ta-pah-tu-ma",source:"yours"}],lessons:[{fromDay:17,title:"KPT-Vaihtelu (Consonant Gradation)",subtitle:"K, P, T Changes in Nouns & Verbs",html:`<h3>Consonant Gradation Basics</h3>
<p>Consonants K, P, T weaken when endings close the syllable:</p>
<div>
<p>KK -> K (Kukka -> Kukan)</p>
<p>TT -> T (Konsertti -> Konsertin)</p>

<p>P -> V (Lapa -> Lavan)</p>
